name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate SKILL.md and eval structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          skill = Path("SKILL.md")
          text = skill.read_text(encoding="utf-8")
          if not text.startswith("---\n"):
              raise SystemExit("SKILL.md must start with YAML frontmatter")
          try:
              _, frontmatter, body = text.split("---\n", 2)
          except ValueError as exc:
              raise SystemExit("SKILL.md frontmatter is not closed") from exc

          fields = {}
          for line in frontmatter.splitlines():
              if ":" in line:
                  key, value = line.split(":", 1)
                  fields[key.strip()] = value.strip()

          name = fields.get("name")
          description = fields.get("description")
          if not name:
              raise SystemExit("Missing name in frontmatter")
          if not re.fullmatch(r"[a-z0-9-]{1,64}", name):
              raise SystemExit(f"Invalid skill name: {name}")
          if not description or len(description) < 80:
              raise SystemExit("Description should clearly explain when to use the skill")
          if "chain-of-thought" in body.lower() and "do not expose" not in body.lower():
              raise SystemExit("Skill must not request exposed private chain-of-thought")

          required_concepts = [
              "competing hypotheses",
              "causal boundary",
              "falsifier",
              "proximate cause",
              "verification plan",
              "do not over-research",
          ]
          body_lower = body.lower()
          missing = [concept for concept in required_concepts if concept not in body_lower]
          if missing:
              raise SystemExit(f"Missing required causal-investigation concepts: {missing}")

          required_evals = [
              "evals/README.md",
              "evals/misleading-first-hypothesis.md",
              "evals/multi-cause-incident.md",
              "evals/security-false-positive.md",
              "evals/trivial-bug.md",
          ]
          missing_evals = [path for path in required_evals if not Path(path).is_file()]
          if missing_evals:
              raise SystemExit(f"Missing behavioral eval files: {missing_evals}")

          print("SKILL.md and behavioral eval structure look valid")
          PY
